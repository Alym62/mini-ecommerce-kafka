syntax = "proto3";

package com.github.alym62.icompras.pedidos;

import "status_pedido.proto";

option java_package = "com.github.alym62.icompras.pedidos";
option java_outer_classname = "PedidoEnviadoProto";

message PedidoEnviado {
  int64 codigo_pedido = 1;
  string codigo_rastreio = 2;
  StatusPedido status_do_pedido = 3;
}
