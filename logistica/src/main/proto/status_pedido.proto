syntax = "proto3";

package com.github.alym62.icompras.logistica;

option java_package = "com.github.alym62.icompras.logistica";
option java_outer_classname = "StatusPedidoProto";

enum StatusPedido {
  STATUS_PEDIDO_UNSPECIFIED = 0;
  REALIZADO = 1;
  PAGO = 2;
  FATURADO = 3;
  ENVIADO = 4;
  ERRO_PAGAMENTO = 5;
  PREPARANDO_ENVIO = 6;
}