syntax = "proto3";

package com.github.alym62.icompras.logistica;

import "status_pedido.proto";

option java_package = "com.github.alym62.icompras.logistica";
option java_outer_classname = "FaturamentoPedidoProto";

message FaturamentoDoPedido {
  int64 codigo_pedido = 1;
  string url_nota_fiscal = 2;
  StatusPedido status_do_pedido = 3;
}
