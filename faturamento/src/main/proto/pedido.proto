syntax = "proto3";

package com.github.alym62.icompras.faturamento;

import "status_pedido.proto";

option java_package = "com.github.alym62.icompras.faturamento";
option java_outer_classname = "PedidoProto";

message Pedido {
  int64 codigo_pedido = 1;
  int64 codigo_cliente = 2;
  string nome = 3;
  string cpf = 4;
  string logradouro = 5;
  string bairro = 6;
  string email = 7;
  string telefone = 8;
  string data_pedido = 9;
  string total = 10; // BigDecimal como string
  StatusPedido status_do_pedido = 11;
  repeated DetalheItemPedido itens = 12;
}

message DetalheItemPedido {
  int64 codigo_produto = 1;
  string nome = 2;
  int32 quantidade = 3;
  string valor_unitario = 4; // BigDecimal como string
}