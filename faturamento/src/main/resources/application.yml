server:
  port: 8083

spring:
  application:
    name: faturamento
  kafka:
    bootstrap-servers: ${SERVER_KAFKA:localhost:29092}
    consumer:
      group-id: icompras-faturamento
      auto-offset-reset: earliest

icompras:
  config:
    kafka:
      group: 'icompras-faturamento'
      topics:
        pedidos-pagos: 'icompras.pedidos-pagos'
        pedidos-faturados: 'icompras.pedidos-faturados'
        pedidos-enviados: 'icompras.pedidos-enviados'

minio:
  url: 'http://localhost:9000'
  access-key: ${ACCESS-MINIO:minioadmin}
  secret-key: ${SECRET-MINIO:minioadmin123}
  bucket: icompras.faturamento
  path: faturas
