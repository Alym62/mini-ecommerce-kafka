version: '3.9'

services:
  db:
    image: postgres:17.4
    container_name: db_i_compras
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POTSGRES_MULTIPLE_DATABASES: icompras_produtos, icompras_pedidos, icompras_clientes
    ports:
      - "5555:5432"
    volumes:
      - ./data:/var/lib/postgresql/data